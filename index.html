<title>HRW Meeting Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one step per screen, header progress strip, footer nav — single committed night palette */
:root{
  --night:#1c1d26;--night-2:#2a2c37;
  --bone:#f2eef6;--bone-70:rgba(242,238,246,.74);--bone-45:rgba(242,238,246,.52);
  --bone-18:rgba(242,238,246,.18);
  --acid:#80ffea;--acid-dim:rgba(128,255,234,.10);--acid-line:rgba(128,255,234,.34);
  --pink:#ff83c4;--pink-dim:rgba(255,131,196,.10);--pink-line:rgba(255,131,196,.38);--violet:#a58bff;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --read:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--bone);font-family:var(--mono);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:60rem;margin:0 auto;padding-inline:16px}
.hdr{display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.mtg-tag{font:500 .75rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--acid);white-space:nowrap}
.progress{flex:1;display:flex;align-items:center;gap:5px;padding:8px 4px;cursor:pointer;min-width:0;border-radius:8px}
.progress:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--bone-18);flex:none}
.dot.done{background:var(--bone-45)}
.dot.active{background:var(--acid);width:9px;height:9px}
.step-of{font-size:.75rem;color:var(--bone-45);white-space:nowrap;font-variant-numeric:tabular-nums}
.view{overflow-y:auto;padding-block:16px 12px;display:flex;flex-direction:column;gap:16px;min-width:0}
.phase{font:500 .75rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acid);min-height:1em}
h2.step-title{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,7vw,3.2rem);line-height:1.02;letter-spacing:-.01em;margin:0;text-wrap:balance}
.handout-flag{font:400 .8125rem/1 var(--mono);color:var(--bone-45);display:flex;align-items:center;gap:8px}
.handout-flag::before{content:'';width:18px;height:1px;background:var(--bone-45)}
.cue{font:italic 400 1.125rem/1.5 var(--serif);color:var(--bone-70);border-left:2px solid var(--bone-18);padding-left:14px;margin:0}
.body{display:flex;flex-direction:column;gap:14px;max-width:44rem}
.body p{font:400 clamp(1.05rem,3.3vw,1.3rem)/1.62 var(--read);margin:0;white-space:pre-wrap}
.bullet{font:400 clamp(1.05rem,3.3vw,1.3rem)/1.55 var(--read);display:grid;grid-template-columns:1.1em 1fr;gap:0 6px}
.bullet strong{font-weight:700;color:var(--acid)}
.bullet-mark{color:var(--acid)}
.host-note{font:italic 400 1rem/1.55 var(--serif);color:var(--bone-45);border:1px dashed var(--bone-18);border-radius:10px;padding:11px 14px;display:flex;gap:9px;max-width:44rem}
.host-note::before{content:'host';font:500 .6875rem/1.9 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--acid);font-style:normal;flex:none}
body.room .host-note{display:none}
.announce{background:var(--acid-dim);border:1px solid var(--acid-line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-width:44rem}
.alabel{font:500 .75rem/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--acid)}
.announce p{font:400 1.1rem/1.55 var(--read);margin:0;white-space:pre-wrap}
.empty{font:italic 400 1rem/1.5 var(--read);color:var(--bone-45);margin:0}
.setup{display:flex;flex-direction:column;gap:18px;max-width:36rem}
.field>span{display:block;font:.75rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--bone-45);margin-bottom:8px}
.setup input,.setup textarea{width:100%;font:400 1.05rem/1.4 var(--read);color:var(--bone);background:rgba(0,0,0,.25);border:1px solid var(--bone-18);border-radius:10px;padding:10px 12px}
.setup textarea{min-height:4.5em;resize:vertical}
.setup input:focus-visible,.setup textarea:focus-visible{outline:2px solid var(--bone);outline-offset:1px}
.type-row{display:flex;gap:8px}
.type-btn{flex:1}
.type-btn.active{background:var(--bone);color:var(--night);border-color:var(--bone)}
.credit{font:.75rem/1.5 var(--mono);color:var(--bone-45)}
.tips{font:.8125rem/1.6 var(--mono);color:var(--bone-45)}
kbd{font:500 .75rem var(--mono);border:1px solid var(--bone-18);border-radius:4px;padding:1px 5px;color:var(--bone-70)}
.ftr{display:flex;align-items:center;gap:8px;padding-block:10px 14px;flex-wrap:wrap}
.spacer{flex:1}
button{font:500 .875rem/1 var(--mono);color:var(--bone);background:transparent;border:1px solid var(--bone-18);border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--bone-45)}
button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
button:disabled{opacity:.3;cursor:default}
button.primary{background:var(--bone);color:var(--night);border-color:var(--bone)}
button.ghost{border-color:transparent;color:var(--bone-45);font-weight:400}
button.ghost[aria-pressed="true"]{color:var(--acid)}
.overview{position:fixed;inset:0;z-index:30;background:rgba(14,14,20,.9);display:flex;align-items:flex-end;justify-content:center}
.ov-list{width:100%;max-width:38rem;max-height:82vh;overflow-y:auto;background:var(--night-2);border-radius:18px 18px 0 0;border-top:1px solid var(--bone-18);padding:14px 0 calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.ov-item{display:flex;align-items:center;gap:12px;padding:10px 22px;border:none;border-radius:0;background:transparent;text-align:left;width:100%;min-height:44px}
.ov-item:hover{background:rgba(242,238,246,.05)}
.ov-num{font:.75rem var(--mono);color:var(--bone-45);width:1.6em;font-variant-numeric:tabular-nums}
.ov-item.active .ov-num{color:var(--acid)}
.ov-label{font:400 1.1rem/1.3 var(--serif);flex:1}
.ov-phase{font:.6875rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--bone-45)}
.ov-close{align-self:flex-end;margin:0 14px 4px;border:none;color:var(--bone-45);font-weight:400}
@media (prefers-reduced-motion:no-preference){.view>*{animation:rise .28s ease both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
.aff-panel{display:flex;flex-direction:column;gap:16px;border:1px solid var(--acid-line);border-radius:14px;padding:16px;background:rgba(216,240,52,.04)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;font-weight:400}
.chip.active{background:var(--acid);color:var(--night);border-color:var(--acid);font-weight:500}
.check{display:flex;gap:10px;align-items:center;font:400 1rem/1.4 var(--read);color:var(--bone-70);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acid);flex:none}
.reset{align-self:flex-start;padding:0}
.dot.aff{border-radius:2px}
[hidden]{display:none!important}
.logo{width:34px;height:34px;flex:none;display:block}
.handout-flag{color:var(--violet)}
.handout-flag::before{background:var(--violet)}
.aff-panel{border-color:var(--pink-line);background:var(--pink-dim)}
.chip.active{background:var(--pink);border-color:var(--pink);color:var(--night)}
.dot.aff{background:var(--pink-line)}.dot.aff.active{background:var(--pink)}
/* pulse */
.pulse{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));max-width:56rem}
.p-block{border:1px solid var(--bone-18);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.p-block h3{font:500 .75rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bone-70);margin:0 0 2px}
.meter{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"label count btns" "track track track";gap:6px 10px;align-items:center}
.m-label{grid-area:label;font:400 1.02rem/1.25 var(--read)}
.m-track{grid-area:track;height:8px;border-radius:99px;background:var(--bone-18);overflow:hidden}
.m-fill{display:block;height:100%;border-radius:99px;transition:width .25s}
.m-cap{background:linear-gradient(90deg,var(--pink),var(--violet),var(--acid))}
.m-depth{background:linear-gradient(90deg,var(--acid),var(--violet))}
.m-count{grid-area:count;font:500 1rem var(--mono);font-variant-numeric:tabular-nums;min-width:1.5em;text-align:right}
.m-btns{grid-area:btns;display:flex;gap:4px}
.m-btn{min-height:34px;width:34px;padding:0;font-size:1.1rem}
.m-btn.plus{border-color:var(--acid-line);color:var(--acid)}
.wx{display:flex;flex-wrap:wrap;gap:8px}
.wx-chip{display:inline-flex;border:1px solid var(--bone-18);border-radius:999px;overflow:hidden}
.wx-chip.on{border-color:var(--violet);background:rgba(165,139,255,.14)}
.wx-chip button{border:none;border-radius:0;min-height:38px;font-weight:400}
.wx-add b{color:var(--violet);font-weight:600;margin-left:4px}
.wx-sub{padding:0 12px;border-left:1px solid var(--bone-18)!important;color:var(--bone-45)}
.lanes{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.lane-btn{font-weight:400;min-height:40px}
.lane-btn.active{background:var(--acid);color:var(--night);border-color:var(--acid);font-weight:500}
.lane-btn small{font:400 .6875rem var(--mono);letter-spacing:.05em;text-transform:uppercase;opacity:.7;margin-left:6px}
.announce.lane{background:var(--pink-dim);border-color:var(--pink-line)}
.announce.lane .alabel{color:var(--pink)}
/* pinned announcements */
.app{grid-template-areas:"hdr" "rail" "view" "ftr";grid-template-rows:auto auto 1fr auto}
.hdr{grid-area:hdr}.view{grid-area:view}.ftr{grid-area:ftr}
.rail{grid-area:rail;background:var(--acid-dim);border:1px solid var(--acid-line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;max-height:7.5em;overflow-y:auto;min-width:0}
.rail p{font:400 1rem/1.45 var(--read);margin:0;white-space:pre-wrap}
@media (min-width:1000px){
  body.pinned .app{max-width:78rem;grid-template-columns:minmax(0,1fr) 19rem;column-gap:28px;grid-template-areas:"hdr hdr" "view rail" "ftr ftr";grid-template-rows:auto 1fr auto}
  body.pinned .rail{align-self:start;margin-top:16px;max-height:calc(100% - 32px)}
  body.pinned .rail p{font-size:1.15rem}
}
</style>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const SK='pb-hrw-comp.v3', STEP_KEY='pb-hrw-comp.step.v3';
const DEFAULTS={meetingType:'affinity',affKey:'abcd',affFocused:true,affEdits:{},hostName:'',topic:'',announce:'',room:false,
  pulse:true,pin:false,lane:'',pc:null};
let S={...DEFAULTS};
try{
  const v3=localStorage.getItem(SK);
  if(v3) S={...S,...JSON.parse(v3)};
  else{
    const v2=JSON.parse(localStorage.getItem('pb-hrw-comp.v2')||'{}');
    ['hostName','topic','announce','room'].forEach(k=>{if(v2[k]!=null)S[k]=v2[k]});
    if(v2.meetingType==='open'||v2.meetingType==='focused') S.meetingType=v2.meetingType;
  }
}catch(e){}
if(!S.affEdits||typeof S.affEdits!=='object') S.affEdits={};

/* ── pulse ── */
const CAP=[{label:'Running on fumes',phrase:'running on fumes'},{label:'Some in the tank',phrase:'running with some in the tank'},{label:'Full cup',phrase:'coming in with a full cup'}];
const WX=['Clear','Breezy','Foggy','Overcast','Stormy','Strange'];
const DEPTH=[{label:'Close to the substances',phrase:'staying close to drugs and drinking'},{label:'Somewhere between',phrase:'the middle'},{label:'Contemplative',phrase:'going contemplative'}];
const LANES=[
  {name:'Close to the substances',text:"Tonight we stay close to our relationships with drugs and drinking: what we use, how, why, what it gives us and what it costs. If we drift, I'll steer us back."},
  {name:'Somewhere between',text:'Tonight we start with our relationships with drugs and drinking and follow them as deep as the room wants to go. Surface is welcome. So is underneath.'},
  {name:'Contemplative',text:"Tonight we go slower and deeper: what's underneath, what we're carrying, what's asking for our attention. You never have to share details about your use or your history to take part."}
];
const freshPulse=()=>({cap:[0,0,0],wx:WX.map(()=>0),depth:[0,0,0]});
const okPulse=p=>p&&Array.isArray(p.cap)&&p.cap.length===3&&Array.isArray(p.wx)&&p.wx.length===WX.length&&Array.isArray(p.depth)&&p.depth.length===3;
if(!okPulse(S.pc)) S.pc=freshPulse();
const top=(arr,tie)=>{const m=Math.max(...arr);if(m<=0)return -1;const idx=arr.map((v,i)=>v===m?i:-1).filter(i=>i>=0);return idx.length>1&&tie!=null?tie(idx):idx[0]};
const suggestedLane=()=>{const d=top(S.pc.depth,()=>1);return d<0?1:d};
const laneIdx=()=>S.lane!==''&&S.lane!=null?+S.lane:suggestedLane();
const lowRoom=()=>{const c=top(S.pc.cap);return c===0};
function pulseRead(){
  const c=top(S.pc.cap), w=top(S.pc.wx), d=top(S.pc.depth,()=>1);
  if(c<0&&w<0&&d<0) return '';
  const parts=[];
  if(c>=0) parts.push(`The room is mostly ${CAP[c].phrase}`);
  if(w>=0) parts.push(`the weather leans ${WX[w].toLowerCase()}`);
  if(d>=0) parts.push(`the pull is toward ${DEPTH[d].phrase}`);
  let s=parts.join(', ');
  s=s.charAt(0).toUpperCase()+s.slice(1)+'.';
  return s;
}
const saveS=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
let cur=0;
try{const v=sessionStorage.getItem(STEP_KEY);if(v)cur=Math.max(0,parseInt(v,10)||0)}catch(e){}
const saveCur=()=>{try{sessionStorage.setItem(STEP_KEY,String(cur))}catch(e){}};

/* ── affinity templates ──
   name: how the host names the meeting · tag: header label · who: who the room is for
   why: "Why we gather this way" slide (blank line = new paragraph)
   prompts: "Lean on the room" slide, one per line · note: host-only reminder */
const TEMPLATES={
  abcd:{label:'ABCD',tag:'ABCD',name:'ABCD, Anybody But Cis Dudes',
    who:'queer fam: queer femmes, gays, and theys',
    why:`We hold this room so we can talk about drugs, drinking, and our lives without having to explain or defend who we are first.

Being queer shapes how we use, how we get policed, how we get treated in clinics and treatment, and who we can call when things go sideways. Here, that isn't a side note. It's the room.`,
    prompts:`Where has being queer shaped your relationship with drugs or drinking?
Where do you get to be all of yourself, using or not?
What would support from queer fam actually look like for you this week?`,
    note:''},
  trans:{label:'Trans & nonbinary',tag:'Trans & NB',name:'Trans & Nonbinary Fam',
    who:'trans, nonbinary, two-spirit, and gender-expansive folks',
    why:`Many of us know what it is to have our bodies' needs decided by somebody else's paperwork: doctors, insurance, family, the state. Hormones are drugs too. Gatekeeping is a harm we already know how to name.

This room is a place to talk about using, drinking, and staying alive as ourselves, without being misgendered, studied, or explained.`,
    prompts:`Where have gatekeeping and the drug war met in your life?
What helps you feel at home in your body, with or without substances?
Who in this room could you reach for this week?`,
    note:'Invite names and pronouns in introductions. Correct misgendering quickly and kindly, then keep going.'},

const AFF_FIELDS=['name','tag','who','why','prompts','note'];
function getAff(){
  const key=TEMPLATES[S.affKey]?S.affKey:'abcd';
  const base=TEMPLATES[key], ed=S.affEdits[key]||{};
  const a={};
  AFF_FIELDS.forEach(f=>a[f]=ed[f]!=null?ed[f]:base[f]);
  return a;
}
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const blocks=s=>String(s||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);

const WELCOME_TAIL = `Everyone is welcome especially people who aren't sure what harm reduction is or whether it can help them. If you have been totally abstinent and/or participate in other types of groups, if you are using or drinking and just beginning to wonder if there is a problem, you are welcome here. If abstinence is not your goal, or if abstinence is your goal, if you are on M.A.T. or O.A.T. like methadone or suboxone, you are welcome here.`;
const OPEN_WELCOME = [
  `Welcome to Harm Reduction Works. My name is {{host}} and I am your host for today's meeting.`,

];
const FOCUSED_WELCOME = [
  `Welcome to Harm Reduction Works. My name is {{host}} and I am your host for today's meeting.`,
  `This is a focused group for people who used drugs or alcohol in the past or currently use drugs or alcohol. If you are not someone who uses drugs or alcohol or you are not someone who used drugs/alcohol in the past, we respectfully ask you to participate in this focused meeting as a witness only. Please look for an open meeting when possible. This is a focused meeting because it's important for people who have or had a direct relationship with drugs and alcohol to come together to discuss their lives and shared experience.`,
  `${WELCOME_TAIL} If you are high, you are welcome here. If you want to learn more about harm reduction for any reason, you are welcome here.`
];
function affinityWelcome(){
  const a=getAff();

const STEPS = [
{phase:'',title:'Before we begin',type:'setup'},
{phase:'Opening',title:'Host welcome',type:'host',

{only:'affinity',phase:'Opening · Affinity',title:'Why we gather this way',type:'host',

 note:()=>getAff().note},
{phase:'Opening',title:'Welcome to Harm Reduction Works',type:'handout',
 cue:'Will the person who has "Welcome to Harm Reduction Works" read our welcoming statement?',
 paras:[
 'We accept people have a relationship with drugs and alcohol. Some people take drugs or drink for fun to make a good feeling even better, or to make something bad feel tolerable, or to even feel normal. Some people love drugs and drinking. Some people enjoy drugs or drinking only occasionally. Some people need drugs or alcohol to function. Some people try to avoid taking any type of drug or drinking for any reason. In a way, avoidance is still a way to have a relationship with drugs and alcohol.',
 'Some people find their drug use or drinking leads to troubling issues. Still others use drugs or drink and have no major consequences. Some have consequences and do not believe drug use or drinking is in any way a cause. Sometimes people are not concerned by the consequences at all.',
 'In general, consequences for drug use and drinking fall into four broad categories:',
 '• Health. This refers to both physical and mental health.',
 '• Legal. Many drugs are illegal. Simple possession or open containers can carry mandatory sentences or fines. The major weapons of The War on Drugs are arrest and incarceration.',
 '• Social. Relationships with others may change or deteriorate to the point of frequent isolation and loneliness.',
 '• Financial. Usually there is a financial cost associated with drug use and drinking. Drugs and alcohol cost money. Many employers require drug tests to get or keep a job.',
 'When issues start to rise in one, some or all of these broad areas, many people start thinking about what is happening and if there is some change needed.']},
{phase:'Opening',title:'All paths',type:'host',announcements:true,
 paras:[
 'Harm reduction includes all paths to recovery as defined by each person in their own way. This includes moderation, continued use with less risk of overdose, death and illnesses like HIV and Hepatitis as well as 12 step and abstinence from all substances. Harm reduction even includes continued use with no goal to change behavior. No path is better or worse than another.',
 'The point is, we can talk about drugs including alcohol, harm and how to reduce harm without confrontation in ways that are respectful, kind, compassionate, and free of moral judgement. Sometimes these conversations are incredibly difficult. What harm reduction teaches us is to talk with others without judgement and to listen deeply to the stories people share.'],
 note:'Pass the donation basket. Then ask: "Are there any harm reduction related announcements?"'},
{phase:'Opening',title:"You're the Expert in Your Own Life",type:'handout',
 cue:'Will the person who has "You\'re the Expert in Your Own Life" please continue with our welcome?',
 paras:[
 "We are concerned more about how you look at drug using and drinking than what goals you might have to change. Of those who choose abstinence, some will abstain only from one substance. Others might abstain from all mind altering substances. Still others might choose to continue to use or drink. Looking at ourselves means figuring out what works and doesn't work, what only works partly or what might work better. Often, this leads to some kind of goal and if it does, that's great too.",
 'In general we find goals sometimes fall into one or some combination of the following categories:',
 '• Amount. How much you use when you use or drink. Sometimes just paying attention to how much is consumed can change behavior in ways that reduce harm.',
 "• Frequency. How often you use or drink. Some people have to use or drink everyday or they go into withdrawal. Some people only like to use at night or only on weekends. Sometimes frequency changes depending on the type of drugs or alcohol consumed. Sometimes patterns change when a person's environment is different. Becoming aware of frequency can give people the chance to change a pattern when change makes sense to them and they are ready.",
 '• Method. How drugs are consumed. Sterile equipment reduces risk of hepatitis and HIV and soft tissue wounds. Going slow can reduce risk of overdose. Having water between drinks helps people stay hydrated.',
 "Goals are not always the same for everyone because priorities, needs, wants and desires are not the same for everyone. Goals are personal because everybody's story and circumstances are different.",
 "Feedback in this room is permission-based — always ask before offering it, and it can be refused at any time, before or during. This matters because well-intentioned encouragement can feel like pressure to someone who isn't ready to change. People change when they're ready and it makes sense to them. This is not a place to argue or debate. We are here to support each other and explore our lives. The only right path for any of us is the one we choose. Each of us is the expert in our own lives."]},
{phase:'Gathering',title:'Introductions',type:'host',
 paras:()=>[
 "Now let's do introductions. Just state your name"+(S.meetingType==='affinity'?', your pronouns if you like,':'')+" and if you would like, a very brief sentence of what you hope to get from the meeting today. There is no need to introduce yourself as an addict or alcoholic.",
 "I'll start. My name is {{host}} and I hope to get _______ from today's meeting."],
 note:"After introductions, move to tonight's topic."},
{show:()=>S.pulse,phase:'Gathering',title:'Take the pulse',type:'pulse'},
{phase:'Gathering',title:"Tonight's topic",type:'host',topic:true},
{only:'affinity',phase:'Discussion · Affinity',title:'Lean on the room',type:'host',
 paras:()=>{
   const p=lines(getAff().prompts).map(x=>'• '+x);
   return ["This room exists so you don't have to translate yourself. Use it. When you share tonight, you can speak from the part of your life that brought you here, and if tonight's topic lands differently because of who we are, say so.",

 }},
{phase:'Discussion',title:'Discussion',type:'host',lane:true,
 paras:[
 'Because this meeting does not discourage feedback, it can be more conversational than other groups. At first, people who are new or less vocal may not feel comfortable joining in. We are all responsible for welcoming people and helping each other feel included in the discussion.',
 'A reminder: feedback is permission-based — ask first, and it can be refused at any time.',
 'If conversation is moving too fast, or if you need to talk about a new topic please raise your hand. I will ask from time to time if anyone needs some space to talk to encourage new voices to add to the conversation.',

 paras:['Before we close is there anyone who needs to speak?'],note:'Give 5 – 10 minutes here.'},
{phase:'Closing',title:'We Believe',type:'handout',
 cue:'Will the person who has "We Believe" please read, followed by the person who has "We Know".',
 paras:[
 '• We believe recovery is not the same as abstinence and abstinence is not always necessary for recovery.',
 '• We believe creating stories that waver from the truth always have consequences.',
 '• We believe everyone has the right to determine their path, even when others might judge that path self-destructive.',
 "• We believe what we do and don't do affects those around us.",
 '• We believe stigma divides people and destroys community.',
 '• We believe we can figure out when to change and how to change if we decide to change.',

 "• We believe respecting each others' choices and actions is an expression of freedom.",

{phase:'Closing',title:'We Know',type:'handout',
 paras:[

{phase:'Closing',title:'Thank you for being here',type:'host',
 paras:()=>[
 "Thank you for being here. We hope this gathering has been helpful to you. We do not encourage or discourage relationships outside this meeting room. However, we do encourage interactions come from kindness, patience and compassion for one another always. One of the ways to create trust is to hold each other's names and stories in confidence. Keeping this confidence is a primary way we show respect for one another. Regardless of personal goals we reduce each other's harm by respecting each other's choices, especially during our gathering time.",
 ...(S.meetingType==='affinity'?["Take this room with you. The people here know some of what you carry without needing it explained. Reach for each other this week."]:[]),
 "No one has to die from drug use. If you haven't used for a while please be mindful of decreased tolerance. Use less than typical. Use slower than typical. Use with others. Carry Naloxone and know how to use it. Whenever possible use sterile equipment. Take care of yourselves and each other. Please tell others our beliefs and what we know. We exist. We are here. Tell people about HRW and bring them. Help us grow."]}
];
const vis=()=>STEPS.filter(s=>(!s.only||s.only===S.meetingType)&&(!s.show||s.show()));
const val=v=>typeof v==='function'?v():v;

const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const sub=t=>esc(t).replace(/\{\{host\}\}/g,esc(S.hostName.trim())||'___________');

function para(t){
  if(t.startsWith('•')){
    const rest=t.slice(1).trim();
    const d=rest.indexOf('.');
    const isLabel=d>0&&d<14&&!rest.startsWith('We ');
    const body=isLabel?`<strong>${esc(rest.slice(0,d+1))}</strong>${esc(rest.slice(d+1))}`:esc(rest);
    return `<div class="bullet"><span class="bullet-mark">•</span><span>${body}</span></div>`;
  }
  return `<p>${sub(t)}</p>`;
}

function affinityPanel(){
  const a=getAff(), key=TEMPLATES[S.affKey]?S.affKey:'abcd';
  const edited=!!S.affEdits[key]&&Object.keys(S.affEdits[key]).length>0;
  return `<div class="aff-panel">
    <div class="field"><span>Affinity template</span>
      <div class="chips">${Object.entries(TEMPLATES).map(([k,t])=>
        `<button class="chip${k===key?' active':''}" data-aff="${k}" id="aff-${k}">${esc(t.label)}</button>`).join('')}</div></div>
    <label class="check" for="affFocused"><input type="checkbox" id="affFocused"${S.affFocused?' checked':''}> Also focused: lived or living experience with drugs or drinking</label>
    <label class="field"><span>Meeting name, said in the welcome</span><input type="text" id="affName" value="${esc(a.name)}" placeholder="e.g. Sunday night ABCD"></label>
    <label class="field"><span>Short label for the header</span><input type="text" id="affTag" value="${esc(a.tag)}" placeholder="e.g. ABCD"></label>
    <label class="field"><span>Who this room is for</span><input type="text" id="affWho" value="${esc(a.who)}" placeholder="e.g. queer femmes, gays, and theys"></label>
    <label class="field"><span>Why we gather this way (slide 3)</span><textarea id="affWhy" rows="5" placeholder="Leave a blank line between paragraphs">${esc(a.why)}</textarea></label>
    <label class="field"><span>Lean on the room prompts, one per line</span><textarea id="affPrompts" rows="4">${esc(a.prompts)}</textarea></label>
    <label class="field"><span>Host-only reminder (hidden in room view)</span><input type="text" id="affNote" value="${esc(a.note)}" placeholder="Optional"></label>
    ${edited?`<button class="ghost reset" id="affReset" data-action="reset">Restore ${esc(TEMPLATES[key].label)} template text</button>`:''}
    <div class="tips">Edits are kept per template on this device.</div>
  </div>`;
}

function meter(group,i,label,count,max){
  const pct=max>0?Math.round(count/max*100):0;
  return `<div class="meter">
    <span class="m-label">${esc(label)}</span>
    <span class="m-track"><span class="m-fill m-${group}" style="width:${pct}%"></span></span>
    <span class="m-count">${count}</span>
    <span class="m-btns"><button class="m-btn" data-pulse="${group}:${i}:-1" aria-label="Remove one from ${esc(label)}"${count?'':' disabled'}>−</button><button class="m-btn plus" data-pulse="${group}:${i}:1" aria-label="Add one to ${esc(label)}">+</button></span>
  </div>`;
}
function pulseView(){
  const p=S.pc, mc=Math.max(1,...p.cap), md=Math.max(1,...p.depth);
  const read=pulseRead(), li=laneIdx(), sug=suggestedLane();
  return `<div class="body"><p>Before we start, let's see where we're at. Answer in the chat, with a reaction, or out loud. No explaining needed.</p></div>
  <div class="pulse">
    <section class="p-block"><h3>Capacity tonight</h3>${CAP.map((c,i)=>meter('cap',i,c.label,p.cap[i],mc)).join('')}</section>
    <section class="p-block"><h3>Inner weather</h3><div class="wx">${WX.map((w,i)=>
      `<span class="wx-chip${p.wx[i]?' on':''}"><button class="wx-add" data-pulse="wx:${i}:1">${esc(w)}${p.wx[i]?` <b>${p.wx[i]}</b>`:''}</button>${p.wx[i]?`<button class="wx-sub" data-pulse="wx:${i}:-1" aria-label="Remove one from ${esc(w)}">−</button>`:''}</span>`).join('')}</div></section>
    <section class="p-block"><h3>How deep are we going?</h3>${DEPTH.map((d,i)=>meter('depth',i,d.label,p.depth[i],md)).join('')}</section>
  </div>
  <div class="announce read"><div class="alabel">Read of the room</div>
    ${read?`<p>${esc(read)}</p>`:`<p class="empty">Tap + as people answer and the read fills in here.</p>`}
    <div class="lanes" role="group" aria-label="Tonight's lane">${LANES.map((l,i)=>
      `<button class="lane-btn${i===li?' active':''}" data-lane="${i}" id="lane-${i}">${esc(l.name)}${i===sug&&read?' <small>suggested</small>':''}</button>`).join('')}</div>
  </div>
  <div class="host-note">Tap + as answers come in. Counts are anonymous. The lane you pick shows up on the Discussion step.</div>
  <button class="ghost reset" data-action="clear-pulse" id="clearPulse">Clear pulse</button>`;
}
function laneBox(){
  if(!S.pulse) return '';
  const l=LANES[laneIdx()];
  return `<div class="announce lane"><div class="alabel">Tonight's lane · ${esc(l.name)}</div><p>${esc(l.text)}</p>${lowRoom()?`<p>Lots of us are running low tonight. Passing is always welcome, and short shares count.</p>`:''}</div>`;
}

function render(step){
  const out=[`<div class="phase">${esc(step.phase)}</div>`,`<h2 class="step-title">${esc(step.title)}</h2>`];
  if(step.type==='pulse'){out.push(pulseView());return out.join('')}
  if(step.type==='setup'){
    const t=S.meetingType;
    out.push(`<div class="setup">
      <div class="field"><span>Meeting type</span>
        <div class="type-row">
          <button class="type-btn${t==='open'?' active':''}" data-type="open" id="typeOpen">Open</button>
          <button class="type-btn${t==='focused'?' active':''}" data-type="focused" id="typeFocused">Focused</button>
          <button class="type-btn${t==='affinity'?' active':''}" data-type="affinity" id="typeAffinity">Affinity</button>
        </div></div>
      ${t==='affinity'?affinityPanel():''}
      <label class="field"><span>Your name</span>
        <input type="text" id="hostInput" value="${esc(S.hostName)}" placeholder="Host name" autocomplete="off"></label>
      <label class="field"><span>Tonight's topic or reading</span>
        <textarea id="topicInput" placeholder="Paste a reading, name a theme, add your discussion questions">${esc(S.topic)}</textarea></label>
      <label class="field"><span>Announcements</span>
        <textarea id="announceInput" placeholder="Naloxone available, upcoming events, resources in chat">${esc(S.announce)}</textarea></label>
      <label class="check" for="pinToggle"><input type="checkbox" id="pinToggle"${S.pin?' checked':''}> Keep announcements on screen for the whole meeting</label>
      <label class="check" for="pulseToggle"><input type="checkbox" id="pulseToggle"${S.pulse?' checked':''}> Take the pulse after introductions (capacity, inner weather, depth)</label>
      <div class="host-note">Assign the four handouts before starting: Welcome to Harm Reduction Works, You're the Expert in Your Own Life, We Believe, We Know.</div>
      <div class="tips">Screen sharing: turn on <b>Room view</b> to hide host notes. Arrow keys <kbd>←</kbd> <kbd>→</kbd> move between steps.</div>
      <div class="credit">HRW format © Albert C. Park &amp; Jessica Tilley 2019 · Adaptation by Paperheart Bureau / Access Point of Georgia</div>
    </div>`);
    return out.join('');
  }
  if(step.type==='handout') out.push(`<div class="handout-flag">read by participant</div>`);
  if(step.cue) out.push(`<p class="cue">${esc(step.cue)}</p>`);
  const paras=val(step.paras)||[];
  if(paras.length||step.topic){
    let body=paras.map(para).join('');
    if(step.topic) body+=S.topic.trim()?`<p>${esc(S.topic)}</p>`:`<p class="empty">No topic set yet. Jump back to step 1 to add one.</p>`;
    out.push(`<div class="body">${body}</div>`);
  }
  if(step.announcements){
    out.push(`<div class="announce"><div class="alabel">Tonight's announcements</div>${S.announce.trim()?`<p>${esc(S.announce)}</p>`:`<p class="empty">No announcements set. Add them on step 1.</p>`}</div>`);
  }
  if(step.lane) out.push(laneBox());
  const note=val(step.note);
  if(note&&String(note).trim()) out.push(`<div class="host-note">${esc(note)}</div>`);
  return out.join('');
}

function headerTag(){
  if(S.meetingType==='affinity') return 'HRW · '+(getAff().tag.trim()||'Affinity');
  return S.meetingType==='focused'?'HRW · Focused':'HRW · Open';
}

function update(keepScroll){
  const steps=vis(), n=steps.length;
  if(cur>=n) cur=0;
  saveCur();
  const y=$('view').scrollTop;
  $('view').innerHTML=render(steps[cur]);
  $('view').scrollTop=keepScroll?y:0;
  $('mtgTag').textContent=headerTag();
  $('stepOf').textContent=`${cur+1} / ${n}`;
  $('progressBar').innerHTML=steps.map((s,i)=>`<span class="dot${s.only?' aff':''}${i<cur?' done':i===cur?' active':''}"></span>`).join('');
  $('prevBtn').disabled=cur===0;
  $('nextBtn').disabled=cur===n-1;
  $('nextBtn').textContent=cur===n-1?'End of meeting':'Next →';
  document.body.classList.toggle('room',!!S.room);
  $('roomBtn').setAttribute('aria-pressed',S.room?'true':'false');
  renderRail(steps[cur]);
}
function renderRail(step){
  const show=S.pin&&S.announce.trim()&&step&&step.type!=='setup'&&!step.announcements;
  document.body.classList.toggle('pinned',!!show);
  $('pinBtn').setAttribute('aria-pressed',S.pin?'true':'false');
  $('rail').hidden=!show;
  if(show) $('rail').innerHTML=`<div class="alabel">Announcements</div><p>${esc(S.announce)}</p>`;
}

const go=d=>{const t=cur+d;if(t>=0&&t<vis().length){cur=t;update()}};
$('prevBtn').addEventListener('click',()=>go(-1));
$('nextBtn').addEventListener('click',()=>go(1));
$('roomBtn').addEventListener('click',()=>{S.room=!S.room;saveS();update(true)});
$('pinBtn').addEventListener('click',()=>{S.pin=!S.pin;saveS();update(true)});

$('view').addEventListener('click',e=>{
  const t=e.target.closest('[data-type]');
  if(t){S.meetingType=t.dataset.type;saveS();update(true);return}
  const a=e.target.closest('[data-aff]');
  if(a){S.affKey=a.dataset.aff;saveS();update(true);return}
  if(e.target.closest('[data-action="reset"]')){delete S.affEdits[S.affKey];saveS();update(true);return}
  const p=e.target.closest('[data-pulse]');
  if(p){const [g,i,d]=p.dataset.pulse.split(':');S.pc[g][+i]=Math.max(0,S.pc[g][+i]+(+d));saveS();update(true);return}
  const l=e.target.closest('[data-lane]');
  if(l){S.lane=l.dataset.lane;saveS();update(true);return}
  if(e.target.closest('[data-action="clear-pulse"]')){S.pc=freshPulse();S.lane='';saveS();update(true)}
});
$('view').addEventListener('change',e=>{
  if(e.target.id==='affFocused'){S.affFocused=e.target.checked;saveS()}
  if(e.target.id==='pinToggle'){S.pin=e.target.checked;saveS();update(true)}
  if(e.target.id==='pulseToggle'){S.pulse=e.target.checked;saveS();update(true)}
});
$('view').addEventListener('input',e=>{
  const top={hostInput:'hostName',topicInput:'topic',announceInput:'announce'};
  const aff={affName:'name',affTag:'tag',affWho:'who',affWhy:'why',affPrompts:'prompts',affNote:'note'};
  const id=e.target.id;
  if(top[id]){S[top[id]]=e.target.value;saveS();return}
  if(aff[id]){
    const k=S.affKey;
    S.affEdits[k]={...(S.affEdits[k]||{}),[aff[id]]:e.target.value};
    saveS();
    $('mtgTag').textContent=headerTag();
  }
});

document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  if(!$('overview').hidden){ if(e.key==='Escape') closeOv(); return; }
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(1);e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1);e.preventDefault()}
});

function openOv(){
  const list=$('ovList');
  list.querySelectorAll('.ov-item').forEach(el=>el.remove());
  vis().forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='ov-item'+(i===cur?' active':'');
    b.innerHTML=`<span class="ov-num">${i+1}</span><span class="ov-label">${esc(s.title)}</span><span class="ov-phase">${esc(s.phase)}</span>`;
    b.addEventListener('click',()=>{cur=i;update();closeOv()});
    list.appendChild(b);
  });
  $('overview').hidden=false;
}
function closeOv(){$('overview').hidden=true}
$('progressBar').addEventListener('click',openOv);
$('progressBar').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){openOv();e.preventDefault()}});
$('ovClose').addEventListener('click',closeOv);
$('overview').addEventListener('click',e=>{if(e.target===$('overview'))closeOv()});

update();
})();
</script>

</body>
</html>
